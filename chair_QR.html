<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>백두 ESD 의자 스펙</title>
<style>
  :root{
    --navy:#3d5a8a; --blue:#1CA7EC; --label:#eef1f6; --ink:#1f2a3a; --sub:#6b778a;
    --line:#d9dfe8; --floor:#f4f6f9;
    --ko:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
    --en:Tahoma,'Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--ko)}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  a{color:inherit}

  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:2px solid var(--navy)}
  .top .co{display:block;line-height:0;text-decoration:none}
  .top .co img{height:34px;width:auto;display:block}
  .top .right{display:flex;align-items:center;gap:10px}
  .snd{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--navy);
    display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
  .snd svg{width:18px;height:18px}
  .snd .off{display:none}
  .snd[aria-pressed="false"] .on{display:none}
  .snd[aria-pressed="false"] .off{display:block}
  .snd[aria-pressed="false"]{color:var(--sub)}
  .snd:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .top .cat{font-family:var(--en);font-size:12px;color:var(--sub)}

  .title{margin:18px 18px 0;text-align:center;font-family:var(--en);font-size:29px;font-weight:700;letter-spacing:-.2px;color:var(--ink);transition:opacity .22s}
  .title.fade{opacity:0}
  /* ---------- 회전 무대 ---------- */
  .stage{position:relative;height:430px;overflow:hidden;touch-action:pan-y;user-select:none;cursor:grab;background:#fff}
  .stage.dragging{cursor:grabbing}
  .slide{position:absolute;left:50%;top:18px;width:84%;height:360px;display:flex;align-items:flex-end;justify-content:center;
    transform-origin:50% 88%;will-change:transform,opacity}
  .slide.anim{transition:transform .38s cubic-bezier(.2,.7,.2,1),opacity .38s}
  .zm{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;transform-origin:0 0;will-change:transform}
  .zm.ease{transition:transform .25s ease-out}
  .stage.zoomed{touch-action:none;cursor:move}
  .stage.zoomed .slide:not(.center){opacity:0!important}
  .zreset{position:absolute;right:10px;bottom:10px;z-index:300;border:1px solid var(--line);background:rgba(255,255,255,.95);
    color:var(--navy);font:inherit;font-size:12px;font-weight:700;padding:7px 12px;border-radius:16px;cursor:pointer;display:none}
  .stage.zoomed .zreset{display:block}
  .stage.zoomed .arrow{display:none}
  .slide img,.slide svg{max-width:100%;max-height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--navy);font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200}
  .arrow.prev{left:10px}.arrow.next{right:10px}
  .arrow:focus-visible,.dots button:focus-visible,.bar a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .nav{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0 4px}
  .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:80%}
  .dots button{width:7px;height:7px;padding:0;border:0;border-radius:4px;background:var(--line);cursor:pointer;transition:width .25s,background .25s}
  .dots button.on{width:20px;background:var(--blue)}
  .hint{text-align:center;font-size:12px;color:var(--sub);margin:4px 0 0;transition:opacity .4s}
  .hint.gone{opacity:0}

  /* ---------- 스펙 ---------- */
  .spec{padding:18px 18px 8px;transition:opacity .22s}
  .spec.fade{opacity:0}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--navy)}
  .head h2{margin:0;font-size:17px;font-weight:700;color:var(--navy)}
  .head .count{font-family:var(--en);font-size:13px;color:var(--sub);white-space:nowrap}
  .desc{font-size:14px;line-height:1.65;color:#3b4658;margin:12px 0 16px}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:left;vertical-align:top;line-height:1.5}
  .tbl th{width:34%;background:var(--label);color:var(--navy);font-weight:700}
  .tbl td{font-family:var(--en)}
  .tbl tr:first-child th,.tbl tr:first-child td{border-top:1px solid var(--line)}
  .head{margin-bottom:14px}
  .sub{margin:22px 0 8px;font-size:15px;font-weight:700;color:var(--navy)}
  .sub span{font-family:var(--en);font-weight:400;font-size:12px;color:var(--sub)}
  .tbl.ht th,.tbl.ht td{text-align:center;width:auto}
  .tbl.ht thead th{font-size:12px;background:var(--label);color:var(--navy)}
  .tbl.ht tbody th{background:#fff;color:var(--ink);font-family:var(--en);font-weight:700}
  .tbl.ht tbody tr:first-child th,.tbl.ht tbody tr:first-child td{border-top:0}
  .pnote{margin:14px 0 0;padding:10px 12px;background:var(--label);border-radius:6px;font-size:13px;color:var(--navy)}
  .note{font-size:11.5px;color:var(--sub);margin:12px 0 0;line-height:1.6}

  /* ---------- 하단 문의 바 ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    background:#fff;border-top:1px solid var(--line);z-index:500}
  .bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:48px;border-radius:8px;
    text-decoration:none;font-size:15px;font-weight:700}
  .bar .tel{background:var(--navy);color:#fff}
  .bar .ask{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .bar svg{width:17px;height:17px}

  @media (min-width:600px){ .title,.stage,.nav,.hint,.spec{max-width:520px;margin-left:auto;margin-right:auto} .top{max-width:520px;margin:0 auto} }
  @media (prefers-reduced-motion:reduce){ .slide.anim,.spec,.title,.dots button{transition:none} }
</style>
</head>

  function wrapM(o){ o = ((o % M) + M) % M; if(o > M/2) o -= M; return o; }

  function layout(animate){
    var W = stage.clientWidth;
    slides.forEach(function(el, i){
      var o = wrapM(i - cs);
      var jump = el._o !== null && Math.abs(o - el._o) > 1.5;
      el._o = o;
      var pos = o + drag / (W * STEP);
      var a = Math.abs(pos);
      var scale = 1 - Math.min(a, 1.6) * 0.34;
      var op = a > 1.55 ? 0 : 1 - Math.min(a, 1) * 0.5;
      el.classList.toggle('anim', animate && !jump && !reduce);
      el.style.transform = 'translateX(-50%) translateX(' + (pos * W * STEP) + 'px) scale(' + scale + ')';
      el.style.opacity = op;
      el.style.zIndex = String(100 - Math.round(a * 10));
      el.setAttribute('aria-hidden', o === 0 ? 'false' : 'true');
      el.classList.toggle('center', o === 0);
    });
  }

  function renderSpec(){
    var ch = CHAIRS[cur];
    var rows = (ch.specs||[]).map(function(r){
      if(!r || r[1] == null || r[1] === '') return '';
      return '<tr><th scope="row">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>';
    }).join('');
    var ht = '';
    if(ch.heights && ch.heights.length){
      ht = '<h3 class="sub">실린더별 높이 <span>(mm)</span></h3>' +
        '<table class="tbl ht"><thead><tr><th scope="col">실린더</th><th scope="col">A 좌판 높이</th><th scope="col">B 전체 높이</th></tr></thead><tbody>' +
        ch.heights.map(function(h){ return '<tr><th scope="row">'+esc(h[0])+'</th><td>'+esc(h[1])+'</td><td>'+esc(h[2])+'</td></tr>'; }).join('') +
        '</tbody></table>';
    }
    specBox.innerHTML =
      '<div class="head"><h2>기본 스펙</h2><span class="count">'+(cur+1)+' / '+N+'</span></div>' +
      (ch.desc ? '<p class="desc">'+esc(ch.desc)+'</p>' : '') +
      '<table class="tbl"><tbody>'+rows+'</tbody></table>' + ht +
      (ch.note ? '<p class="pnote">'+esc(ch.note)+'</p>' : '') +
      '<p class="note">'+esc(CONFIG.note)+'</p>';
    dots.forEach(function(d, i){ d.classList.toggle('on', i === cur); d.setAttribute('aria-current', i===cur?'true':'false'); });
    titleBox.textContent = ch.name;
    document.title = ch.name + ' 스펙 | 백두코퍼레이션';
    try{ history.replaceState(null, '', location.pathname + '?id=' + encodeURIComponent(ch.id)); }catch(e){}
  }

  var fadeTimer;
  /* ---------- 넘김 효과음 '딸깍' (음원 파일 없이 합성) ---------- */
  var ac = null, noise = null, lastTick = 0;
  var soundOn = true;
  try{ if(localStorage.getItem('bdChairSound') === 'off') soundOn = false; }catch(_){}
  var sndBtn = document.getElementById('snd');
  function syncSndBtn(){
    sndBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    sndBtn.setAttribute('aria-label', soundOn ? '넘김 소리 끄기' : '넘김 소리 켜기');
  }
  syncSndBtn();
  sndBtn.onclick = function(){
    soundOn = !soundOn; syncSndBtn();
    try{ localStorage.setItem('bdChairSound', soundOn ? 'on' : 'off'); }catch(_){}
    if(soundOn){ unlock(); tick(0); }
  };
  function unlock(){
    if(!soundOn) return;
    try{
      if(!ac){
        var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
        ac = new AC();
        var len = Math.floor(ac.sampleRate * 0.03);
        noise = ac.createBuffer(1, len, ac.sampleRate);
        var d = noise.getChannelData(0);
        for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
      }
      if(ac.state === 'suspended') ac.resume();
    }catch(_){ ac = null; }
  }
  var VOLUME = 1.0;               // 딸깍 음량 (0.3 작게 ~ 1.0 크게)
  var bus = null;
  function tick(when){            // when: 지금부터 몇 초 뒤
    if(!soundOn || !ac) return;
    if(!bus){                     // 크게 내도 찢어지지 않게 리미터 통과
      var comp = ac.createDynamicsCompressor();
      comp.threshold.value = -6; comp.knee.value = 0; comp.ratio.value = 20;
      comp.attack.value = 0.001; comp.release.value = 0.05;
      bus = ac.createGain(); bus.gain.value = VOLUME;
      bus.connect(comp); comp.connect(ac.destination);
    }
    var t = ac.currentTime + (when || 0);
    // 1) 딸깍의 '딱' — 짧은 잡음
    var src = ac.createBufferSource(); src.buffer = noise;
    var bp = ac.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 2600 + Math.random()*500; bp.Q.value = 2.5;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(3.0, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    src.connect(bp); bp.connect(g); g.connect(bus);
    src.start(t); src.stop(t + 0.045);
    // 2) 딸깍의 '깍' — 짧은 몸통 울림 (체감 음량 보강)
    var o = ac.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(1500, t);
    o.frequency.exponentialRampToValueAtTime(700, t + 0.025);
    var og = ac.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.9, t + 0.002);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(og); og.connect(bus);
    o.start(t); o.stop(t + 0.04);
  }
  stage.addEventListener('pointerdown', unlock);
  document.addEventListener('touchend', unlock, {passive:true});   // 아이폰 소리 잠금 해제용

  function step(d, px){          // 무대를 d칸 이동 (px: 소리 낼 남은 거리)
    if(d !== 0) resetZoom(false);
    if(d !== 0) tick(0);        // 의자가 한 칸 넘어갈 때 '딸깍' 한 번
    drag = 0;
    if(d === 0){ layout(true); return; }
    cs = ((cs + d) % M + M) % M;
    cur = slideData[cs];
    layout(true);
    hint.classList.add('gone');
    if(reduce){ renderSpec(); return; }
    specBox.classList.add('fade'); titleBox.classList.add('fade');
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(function(){ renderSpec(); specBox.classList.remove('fade'); titleBox.classList.remove('fade'); }, 180);
  }
  function goChair(ci){      // 점 버튼: 해당 의자가 있는 가장 가까운 슬라이드로
    var best = 0, bestAbs = 1e9;
    for(var i=0;i<M;i++){ if(slideData[i]===ci){ var d = wrapM(i - cs); if(Math.abs(d) < bestAbs){ bestAbs = Math.abs(d); best = d; } } }
    step(best);
  }

  document.getElementById('prev').onclick = function(e){ e.stopPropagation(); unlock(); step(-1); };
  document.getElementById('next').onclick = function(e){ e.stopPropagation(); unlock(); step(1); };
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') step(-1);
    if(e.key === 'ArrowRight') step(1);
  });

  /* ---------- 확대 (두 손가락 벌리기 · 두 번 탭) ---------- */
  var ZMAX = 4, z = 1, tx = 0, ty = 0;
  var zBtn = document.getElementById('zreset');
  function zoomEl(){ return slides[cs].querySelector('.zm'); }
  function applyZoom(ease){
    var el = zoomEl();
    el.classList.toggle('ease', !!ease && !reduce);
    el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')';
    stage.classList.toggle('zoomed', z > 1.001);
  }
  function clampPan(){
    var el = zoomEl(), W = el.offsetWidth, H = el.offsetHeight;
    tx = Math.min(0, Math.max(W * (1 - z), tx));
    ty = Math.min(0, Math.max(H * (1 - z), ty));
  }
  function resetZoom(ease){
    if(z === 1 && tx === 0 && ty === 0) return;
    z = 1; tx = 0; ty = 0; applyZoom(ease);
  }
  function local(x, y){ var r = zoomEl().parentElement.getBoundingClientRect(); return { x: x - r.left, y: y - r.top }; }
  zBtn.onclick = function(e){ e.stopPropagation(); resetZoom(true); };
  stage.addEventListener('gesturestart', function(e){ e.preventDefault(); });   // 아이폰 화면 전체 확대 방지

  /* ---------- 손가락 입력 (넘기기 / 확대 / 이동) ---------- */
  var pts = {}, cnt = 0;
  var mode = null;            // 'swipe' | 'pinch' | 'pan'
  var sx = 0, sy = 0, axis = null, pid = null;
  var p0 = null, pinch0 = null, lastTap = { t: 0, x: 0, y: 0 };

  function two(){ var k = Object.keys(pts); return [pts[k[0]], pts[k[1]]]; }
  function startPan(e){ mode = 'pan'; pid = e.pointerId; try{ stage.setPointerCapture(pid); }catch(_){} p0 = { x: e.clientX, y: e.clientY, tx: tx, ty: ty }; }
  function startPinch(){
    var q = two(), m = local((q[0].x + q[1].x) / 2, (q[0].y + q[1].y) / 2);
    pinch0 = { d: Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y) || 1, z: z, cx: (m.x - tx) / z, cy: (m.y - ty) / z };
    mode = 'pinch';
    if(drag !== 0){ drag = 0; layout(true); }
    stage.classList.remove('dragging');
  }

  stage.addEventListener('pointerdown', function(e){
    if(e.target.closest('.arrow,.zreset')) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY }; cnt = Object.keys(pts).length;
    if(cnt === 2){ Object.keys(pts).forEach(function(k){ try{ stage.setPointerCapture(+k); }catch(_){} }); startPinch(); moved = true; return; }
    if(cnt > 2) return;
    moved = false;
    if(z > 1.001){ startPan(e); return; }
    mode = 'swipe'; sx = e.clientX; sy = e.clientY; axis = null; pid = e.pointerId;
  });

  stage.addEventListener('pointermove', function(e){
    if(!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if(mode === 'pinch' && cnt >= 2){
      var q = two(), m = local((q[0].x + q[1].x) / 2, (q[0].y + q[1].y) / 2);
      var d = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y);
      z = Math.min(ZMAX, Math.max(0.8, pinch0.z * d / pinch0.d));
      tx = m.x - z * pinch0.cx; ty = m.y - z * pinch0.cy;
      applyZoom(false); return;
    }
    if(mode === 'pan' && e.pointerId === pid){
      var mx = e.clientX - p0.x, my = e.clientY - p0.y;
      if(Math.abs(mx) + Math.abs(my) > 6) moved = true;
      tx = p0.tx + mx; ty = p0.ty + my; clampPan(); applyZoom(false); return;
    }
    if(mode !== 'swipe' || e.pointerId !== pid) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(!axis){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if(axis === 'x'){ try{ stage.setPointerCapture(pid); }catch(_){} stage.classList.add('dragging'); }
    }
    if(axis !== 'x') return;
    moved = true;
    drag = dx;
    layout(false);
  });

  function end(e){
    if(!pts[e.pointerId]) return;
    delete pts[e.pointerId]; cnt = Object.keys(pts).length;

    if(mode === 'pinch'){
      if(cnt >= 2) return;
      if(z < 1.05){ resetZoom(true); mode = null; }
      else {
        clampPan(); applyZoom(true);
        if(cnt === 1){ var k = Object.keys(pts)[0]; startPan({ pointerId: +k, clientX: pts[k].x, clientY: pts[k].y }); }
        else mode = null;
      }
      setTimeout(function(){ moved = false; }, 0);
      return;
    }
    if(mode === 'pan'){
      if(cnt === 0){
        if(!moved) doubleTap(e);
        mode = null; setTimeout(function(){ moved = false; }, 0);
      }
      return;
    }
    if(mode === 'swipe' && e.pointerId === pid){
      stage.classList.remove('dragging');
      if(axis === 'x'){
        var th = stage.clientWidth * 0.12;
        var W = stage.clientWidth * STEP;
        if(drag < -th) step(1, W - Math.abs(drag));
        else if(drag > th) step(-1, W - Math.abs(drag));
        else { drag = 0; layout(true); }
        setTimeout(function(){ moved = false; }, 0);
      } else if(!axis){
        doubleTap(e);
      }
      axis = null; mode = null; pid = null;
    }
  }
  function doubleTap(e){          // 가운데 의자를 두 번 탭하면 2.5배 / 원래 크기
    var r = slides[cs].getBoundingClientRect();
    if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom){ lastTap.t = 0; return; }
    var now = Date.now();
    if(now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30){
      lastTap.t = 0;
      if(z > 1.001) resetZoom(true);
      else { var p = local(e.clientX, e.clientY); z = 2.5; tx = p.x - z * p.x; ty = p.y - z * p.y; clampPan(); applyZoom(true); }
    } else lastTap = { t: now, x: e.clientX, y: e.clientY };
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  window.addEventListener('resize', function(){ layout(false); });

  if(N < 2){ document.getElementById('prev').hidden = true; document.getElementById('next').hidden = true; hint.hidden = true; }
  layout(false);
  renderSpec();
})();
</script>
</body>
</html>
